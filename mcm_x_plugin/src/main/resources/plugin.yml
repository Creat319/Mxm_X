name: McmX
version: '1.0.0'
main: com.mcmx.backstabbed.McmxPlugin
api-version: '1.21'
description: Backstabbed! 扩展身份插件（侦探 / 奶龙 / 眼线）
author: McmX
commands:
  mcmx:
    description: McmX 身份扩展命令
    usage: /mcmx help
